name: Entrega contínua

on:
  workflow_call:

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest
    steps:

      # 1️⃣ Baixar o artifact buildado
      - name: Download Build Artifact
        uses: actions/download-artifact@v3
        with:
          name: programa

      # 2️⃣ Fazer checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # 3️⃣ Instalar Docker e Docker Compose
      - name: Setup Docker
        uses: docker/setup-docker@v3

      # 4️⃣ Deploy via SSH usando chave privada
      - name: Deploy to Staging server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Configurar variáveis de ambiente do banco
            export HOST=${{ secrets.DBHOST }}
            export USER=${{ secrets.DBUSER }}
            export PASSWORD=${{ secrets.DBPASSWORD }}
            export DBNAME=${{ secrets.DBNAME }}
            export DBPORT=${{ secrets.DBPORT }}
            export PORT=8000

            # Entrar na pasta do projeto
            cd /home/${{ secrets.REMOTE_USER }}/programa

            # Parar containers antigos, atualizar e subir containers
            docker-compose down
            docker-compose pull
            docker-compose up -d
