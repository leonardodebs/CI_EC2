name: Entrega contínua

on:
  workflow_call:

jobs:
  EC2:
    runs-on: ubuntu-latest
    steps:
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: programa

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "programa" # Arquivo a ser copiado
          target: "/home/${{ secrets.REMOTE_USER }}" # Diretório de destino
          script: |
            # Renomeia o artefato para 'main' para consistência
            mv programa main

            export HOST=${{ secrets.DBHOST }}
            export USER=${{ secrets.DBUSER }}
            export PASSWORD=${{ secrets.DBPASSWORD }}
            export DBNAME=${{ secrets.DBNAME }}
            export DBPORT=${{ secrets.DBPORT }}
            export PORT=8000
            chmod +x main

            # Para qualquer processo 'main' antigo antes de iniciar um novo
            pkill main || true

            nohup ./main > nohup.out 2> nohup.err < /dev/null &
