name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.22']
        os: ['ubuntu-latest']
    # Service containers to run side-car containers for your job.
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:latest
        # Environment variables passed to the container
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: root
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true # Habilita o cache de dependências do Go

    - name: Run Tests
      # O host 'postgres' é o nome do serviço definido acima
      env:
        HOST: localhost
        DBPORT: 5432
        USER: root
        PASSWORD: root
        DBNAME: root
      run: go test -v ./...
      
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build application
      run: go build -v -o programa main.go
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: programa
        path: programa

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

  Deploy_EC2:
    needs: build
    uses: ./.github/workflows/EC2.yml
    secrets: inherit
